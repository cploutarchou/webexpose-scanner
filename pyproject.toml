[project]
name = "webexpose-scanner"
version = "1.0.1"
authors = [
    {name = "Christos Ploutarchou", email = "cploutarchou@gmail.com"},
]
description = "Professional web exposure assessment tool for authorized security testing"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["security", "scanner", "web", "exposure", "vulnerability", "assessment", "pentesting", "osint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/cploutarchou/webexpose-scanner"
Repository = "https://github.com/cploutarchou/webexpose-scanner"
Documentation = "https://github.com/cploutarchou/webexpose-scanner#readme"
"Bug Reports" = "https://github.com/cploutarchou/webexpose-scanner/issues"
"Source Code" = "https://github.com/cploutarchou/webexpose-scanner"

[project.scripts]
webexpose = "main:app"
webexpose-scanner = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scanner", "main.py"]

[tool.hatch.build.targets.sdist]
include = [
    "scanner/",
    "main.py",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
